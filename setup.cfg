[metadata]
name = shepherd-sdk
version = 1.0.0
description = Lightweight Python client for the Shep Go2 API

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8

[options.packages.find]
where = src

[options.extras_require]
all =
    websocket-client>=1.3,<2
    opencv-python>=4.5
    numpy>=1.19
    ultralytics>=8.0

